[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "marg"
version = "0.1.0"
description = "Point it at a repo, get a grounded onboarding guide. An onboarding agent built on the BharatCode model API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Mohnish Rawat" }]
keywords = ["onboarding", "documentation", "agent", "llm", "bharatcode", "developer-tools"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Environment :: Console",
  "Topic :: Software Development :: Documentation",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
marg = "marg.cli:main"

[project.urls]
Homepage = "https://github.com/mqhnish/marg"

[tool.setuptools]
packages = ["marg"]
